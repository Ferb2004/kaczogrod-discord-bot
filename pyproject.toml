[project]
name = "kaczogrod-bot"
version = "3.0"
description = "Discord bot napisany w pythonie."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.14.5",
    "asyncpg==0.32.0",
    "cryptography==50.0.2",
    "davey==0.1.7",
    "discord-py==2.7.1",
    "feedparser==6.0.14",
    "mcstatus==14.2.0",
    "pynacl==1.6.2",
    "python-dotenv==1.2.4",
    "spotifyscraper>=3.9.2",
    "spotipy==2.26.0",
    "yoyo-migrations==9.0.0",
    "yt-dlp==2026.10.26",
    "ytmusicapi>=1.12.3",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-cov>=7.1.0",
    "ruff==0.17.3",
]
