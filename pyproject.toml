[project]
name = "kaczogrod-bot"
version = "3.0"
description = "Discord bot napisany w pythonie."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.14.3",
    "asyncpg==0.31.0",
    "cryptography==50.0.1",
    "davey==0.1.6",
    "discord-py==2.7.1",
    "feedparser==6.0.14",
    "mcstatus==14.1.0",
    "pip==26.2.1",
    "pygithub==2.10.0",
    "pynacl==1.6.2",
    "python-dotenv==1.2.3",
    "ruff==0.16.4",
    "spotipy==2.26.0",
    "yoyo-migrations==9.0.0",
    "yt-dlp==2026.8.19",
    "ytmusicapi>=1.12.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]
